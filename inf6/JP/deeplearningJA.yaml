meta:
  title: "Deep Learning 基礎と応用"
  subject: "深層学習"
  domain: "機械学習 / AI"
  keywords: [ニューラルネットワーク, 畳み込み, RNN, トランスフォーマー]




sections:
  - section_id: sec1
    heading: "ニューラルネットワークの基本原理"
    content: |
      • ニューラルネットワークの定義：パーセプトロン、多層構造  
      • 層を重ねることで階層的な特徴学習が可能になる  
      • コスト最小化のための勾配降下法：学習率、収束条件  
      • よく使われる損失関数:
        – 平均二乗誤差（回帰）  
        – クロスエントロピー（分類）  
      • 過学習防止のための正則化手法:
        – L2正則化（ウェイト減衰）  
        – ドロップアウト  

  - section_id: sec2
    heading: "勾配伝播と重み初期化"
    content: |
      • 単層モデルから多層モデルへの拡張（バックプロパゲーション）  
      • 連鎖律を用いた効率的な勾配計算  
      • 重みの初期化方法:
        – Xavier（Glorot）初期化  
        – He初期化  
      • バッチ学習のベクトル化演算と現代ハードウェアでの高速化  

  - section_id: sec3
    heading: "非線形活性化関数と安定性"
    content: |
      • Sigmoid, tanh, ReLU の比較:
        – 計算コストや特性の違い  
        – 飽和領域と勾配の流れへの影響  
      • 勾配消失・爆発問題:
        – 深層でReLUが選ばれる理由  
      • ReLUバリエーション:
        – Leaky ReLU  
        – Parametric ReLU（PReLU）  
      • モデル表現力向上における非線形性の重要性  

  - section_id: sec4
    heading: "学習戦略と効率化技術"
    content: |
      • ミニバッチ勾配降下法アルゴリズム  
      • Momentum, RMSprop, Adam などの最適化手法（擬似コード例付き）  
      • ハイパーパラメータの調整:
        – 学習率減衰スケジュール  
        – 早期終了基準  
        – グリッドサーチやランダムサーチ  
      • よくある落とし穴:
        – バッチサイズが大きすぎる  
        – モーメンタム過剰による発散  
      • 検証性能に基づいた学習率や減衰率の選択ポイント  

  - section_id: sec5
    heading: "モデル評価時の正規化"
    content: |
      訓練時、各ミニバッチ X に対し:
        1. μ_batch = (1/m) ∑ₙ zₙ  
        2. σ²_batch = (1/m) ∑ₙ (zₙ − μ_batch)²  
        3. z_norm = (z − μ_batch) / √(σ²_batch + ε)  
        4. z_tilde = γ · z_norm + β  

      テスト時は m=1 でバッチ統計が計算できないため、訓練中にランニング平均を維持:
        μ_running ← α · μ_running + (1 − α) · μ_batch  
        σ²_running ← α · σ²_running + (1 − α) · σ²_batch  

      テスト時はランニング平均を使用:
        z_norm_test = (z_test − μ_running) / √(σ²_running + ε)  
        z_tilde_test = γ · z_norm_test + β  

      この「バイアス補正」方式により、1サンプル評価でも安定したバッチ正規化が可能  

  - section_id: sec6
    heading: "バイアス補正による推定値の平滑化"
    content: |
      v₀=0 でEMAを初期化すると、初期値v₁, v₂,…が0方向にバイアスされる。例: β=0.98 の場合:  
        v₁ = 0.02·θ₁  
        v₂ = 0.98·v₁ + 0.02·θ₂ = 0.0196·θ₁ + 0.02·θ₂  

      このウォームアップバイアスを (1−βᵗ) で補正:  
        v̂ₜ = vₜ / (1 − βᵗ)  

      例: t=2, β=0.98 の場合  
        1−β² = 1−0.9604 = 0.0396  
        v̂₂ = (0.0196·θ₁ + 0.02·θ₂) / 0.0396  

      tが大きくなるとβᵗ→0、補正係数→1となりバイアスは消失  

  - section_id: sec7
    heading: "モデルの汎化とドメインシフト"
    content: |
      • 用語定義:  
        – human_error：Bayes誤差の近似値（例: 猫 vs 非猫で約1%）  
        – training_error  
        – training_dev_error：訓練データから分けた開発用サブセット（同分布）  
        – dev_error, test_error  
      • 手順:  
        1. training_dev_set を分離  
        2. training_set で学習  
        3. [training_set, training_dev_set, dev_set] で評価  
      • 例:
        – training_error=1%、training_dev_error=9%、dev_error=10% → 分散大  
        – training_error=1%、training_dev_error=1.5%、dev_error=10% → データ不一致  
        – training_error=10%、training_dev_error=11%、dev_error=12% → バイアス大  
      • ギャップ指標:  
        – avoidable_bias = training_error − human_error  
        – variance_gap = training_dev_error − training_error  
        – mismatch_gap = dev_error − training_dev_error  

  - section_id: sec8
    heading: "文脈対応型再帰モデル"
    content: |
      双方向RNNは、標準的な順方向RNNに加え、入力系列に対して逆方向のパスも実行する。入力x₁…x_Tに対し:  
        • →aₜ：順方向RNN活性化 (t=1→T)  
        • ←aₜ：逆方向RNN活性化 (t=T→1)  

      各時刻で連結:  
        aₜ = [→aₜ; ←aₜ]  
      その後予測:  
        ŷₜ = g(W_y · aₜ + b_y)  

      利点: 過去と未来の両文脈を活用可能  
      欠点: 系列全体を見てからでないと出力できず、リアルタイム性に欠ける  

  - section_id: sec9
    heading: "言語タスクの出力類似度評価"
    content: |
      • BLEU: 機械翻訳などで生成文と参照文の類似度を数値化  
      1. 修正n-gram精度 Pₙ = クリップ数 / 出力n-gram総数  
      2. 短縮ペナルティ BP = 出力長>参照長なら1、そうでなければ exp(1 − 参照長/出力長)  
      3. 組み合わせ: BLEU = BP · exp((1/4) Σₙ=1⁴ log Pₙ)  
      • 範囲: 0〜1（1.0=完全一致）  
      • 機械翻訳、画像キャプション生成などで利用  

  - section_id: sec10
    heading: "単一ステージ検出手法"
    content: |
      スライディングウィンドウ型分類器と異なり、YOLOは1つの畳み込み回帰問題として物体検出を行う。S×Sグリッド（例: 3×3, 19×19）に分割した入力画像（例: 100×100×3）に対して、各セルごとに:  
        • PC（物体存在確率）  
        • (Bx, By, Bh, Bw) — ボックス中心オフセットと高さ/幅（セル内比率）  
        • C₁…Cₖ — クラス確率  

      **学習ラベル:**  
        • 真の物体が属するセルにはPC=1、ボックス、one-hotクラスを割り当て  
        • 他のセルはPC=0（非対象）  

      **出力テンソル:**  
      S×S×B（B=1+4+k）のテンソル。例: 3クラスならB=8で3×3×8や19×19×8  

      **ボックスのパラメータ化:**  
        • セル内ローカル座標系 [0,1]×[0,1]  
        • Bx, By = セル内中心オフセット  
        • Bh, Bw = 高さ/幅の正規化（1を超える場合も）  
        • 実装では(Bx, By)にシグモイド、(Bh, Bw)に指数関数を使うことが多い
        
        
  - section_id: sec11
    heading: "計算グラフにおける微分"
    content: |
      • J = 3 · (a + b · c) の計算グラフ：
        1. u = b × c
        2. v = a + u
        3. J = 3 × v
      • 逆伝播（右→左パス）で各変数に関する微分を計算：
        – dJ/dv = 3
        – dJ/da = 3 (dJ/dv × dv/da)
        – dJ/du = 3 (dJ/dv × dv/du)
        – dJ/db = 6 (dJ/du × du/db)
        – dJ/dc = 9 (dJ/du × du/dc)
      • 実装上、J の X に関する導関数は dX と名付ける
  - section_id: sec12
    heading: "傾きの解釈と導関数の概念"
    content: |
      • 導関数 = f(a) の変化率 Δf/Δa の極限値
      • 線形例：f(a) = 3a の場合
        – a = 2 のとき: a→2.001 → f=6→6.003 → Δf/Δa = 3
      • 一般的に導関数は lim_{Δa→0} (Δf/Δa)
      • 線形関数は一定の傾きを持つ
  - section_id: sec22
    heading: "ニューラルネットワークのレイヤー演算"
    content: |
      各レイヤー L は順伝播と逆伝播の2つの関数を実装：

      1. 順伝播
         - 入力：a⁽ᴸ⁻¹⁾, W⁽ᴸ⁾, b⁽ᴸ⁾
         - 計算：
           z⁽ᴸ⁾ = W⁽ᴸ⁾·a⁽ᴸ⁻¹⁾ + b⁽ᴸ⁾
           a⁽ᴸ⁾ = g(z⁽ᴸ⁾)
         - 出力：a⁽ᴸ⁾, 次の逆伝播用に z⁽ᴸ⁾, W⁽ᴸ⁾, b⁽ᴸ⁾ をキャッシュ
      2. 逆伝播
         - 入力：da⁽ᴸ⁾, キャッシュ(z⁽ᴸ⁾, W⁽ᴸ⁾, b⁽ᴸ⁾)
         - 計算：
           dz⁽ᴸ⁾ = da⁽ᴸ⁾ ⊙ g′(z⁽ᴸ⁾)
           dW⁽ᴸ⁾ = dz⁽ᴸ⁾·(a⁽ᴸ⁻¹⁾)ᵀ
           db⁽ᴸ⁾ = sum(dz⁽ᴸ⁾)
           da⁽ᴸ⁻¹⁾ = (W⁽ᴸ⁾)ᵀ·dz⁽ᴸ⁾
         - 出力：da⁽ᴸ⁻¹⁾, dW⁽ᴸ⁾, db⁽ᴸ⁾
  - section_id: sec23
    heading: "畳み込みネットワークの例構造"
    content: |
      32×32×3 入力の数字分類例：
      1. レイヤー1 (Conv + Pool)
         – Conv1:フィルタ6×(5×5),ストライド1,パディングなし→28×28×6
         – ReLU
         – MaxPool1: f=2,s=2→14×14×6
      2. レイヤー2 (Conv + Pool)
         – Conv2:フィルタ10×(5×5),ストライド1,パディングなし→10×10×10
         – ReLU
         – MaxPool2: f=2,s=2→5×5×10
      3. レイヤー3 (Conv + Pool)
         – Conv3:フィルタ16×(5×5),ストライド1,パディングなし→1×1×16
         – MaxPool3: f=2,s=2→5×5×16
      4. 全結合層
         – Flatten→400×1
         – FC4:400→120+ReLU
         – FC5:120→84+ReLU
         – FC6:84→10→Softmax
  - section_id: sec24
    heading: "代表的な畳み込みモデル歴史"
    content: |
      1. LeNet-5 (1998): 32×32×1 入力, ≈60K パラメータ
      2. AlexNet (2012): 227×227×3 入力, ≈60M パラメータ
      3. VGG-16 (2014): 224×224×3 入力, ≈138M パラメータ
      • 空間解像度↓, チャネル深度↑ のパターン
  - section_id: sec25
    heading: "ラベル品質と評価"
    content: |
      • ラベルノイズ: 低レートなら許容可能
      • Dev/Test 再ラベリング条件: エラー率20-30%超で実施
      • 手順:
        1. Dev/Test 共に再ラベリング
        2. サンプリングによる修正

  - section_id: sec26
    heading: "ビジョンタスクと畳み込みソリューション"
    content: |
      • 自動運転車：車両や歩行者の検出
      • 顔認識：生体認証アクセス
      • 写真アプリ：画像の強調・整理
      • スタイル転送：コンテンツとアートスタイルの融合
      **課題**: 高次元入力（例：1000×1000×3 → 3M特徴量）
      **解決策**: 共有重み畳み込みによるパラメータ削減

  - section_id: sec27
    heading: "グリッドベースCNNによる直接物体局所化"
    content: |
      • S×S グリッド上で単一の畳み込み回帰として検出を行う
      • 各セルで PC, (Bx,By,Bh,Bw), C₁…Cₖ を予測 → S×S×(1+4+k) テンソル
      • ラベル割り当て：セル中央への真の物体割当て + PC=1、ボックス、クラス; 他は PC=0
      • 推論：ボックス復元 + 非最大抑制
      • リアルタイム処理に対応可能

  - section_id: sec28
    heading: "物体検出におけるIoU評価"
    content: |
      • IoU = intersection area / union area
      • 完全一致 → IoU=1; 閾値 (例: ≥0.5) で正検出判定
      • 重複検出排除 (非最大抑制) で使用

  - section_id: sec29
    heading: "エンコーダ–デコーダネットワークと特徴橋渡し"
    content: |
      • エンコーダ–デコーダは詳細を失いがち
      • スキップ接続で高解像度マップをデコーダへコピー
      • セマンティックセグメンテーションで高精度なラベリングを実現

  - section_id: sec30
    heading: "多チャネル畳み込み演算"
    content: |
      • 入力: H×W×C ボリューム (例: 6×6×3)
      • フィルタ: f×f×C カーネル
      • 空間上をスライドし、出力を計算
      • K フィルタ → (H−f+1)×(W−f+1)×K 出力ボリューム

  - section_id: sec31
    heading: "画像合成におけるコンテンツ・スタイル表現"
    content: |
      J(G) = α·J_content(C,G) + β·J_style(S,G)
      1. J_content: C vs. G の特徴マップ間距離
      2. J_style: 各層のグラム行列間距離
      最適化: ノイズからの勾配降下
      α/β でコンテンツ vs. スタイルのバランス調整

  - section_id: sec32
    heading: "視覚モデル向け合成データ生成"
    content: |
      • 一般化向上のためのデータ拡張
      • 空間: フリップ、ランダムクロップ、回転、ワーピング
      • 色: チャンネルシフト、PCAベースジッター
      • 実装: データローダー内でオンザフライ並列処理
      • ハイパーパラメータ: クロップスケール、フリップ確率、色シフト幅

  - section_id: sec33
    heading: "畳み込みフィルタによる特徴抽出"
    content: |
      • 畳み込みはエッジ検出などの基本操作
      • 例: 6×6 グレースケール入力 & 3×3 垂直エッジフィルタ
        [1,1,1; 0,0,0; -1,-1,-1]
      • 出力は 4×4、各要素は 3×3 の積和
      • 横エッジ用フィルタ例:
        [1,0,-1; 1,0,-1; 1,0,-1]
      • conv2d 等の関数で高速化

  - section_id: sec34
    heading: "系列モデリング構造"
    content: |
      • Many-to-Many: x(1)…x(Tx)→y(1)…y(Ty)
      • Many-to-One: x(1)…x(Tx)→単一出力
      • One-to-Many: 単一入力→系列出力
      • One-to-One: 1対1フィードフォワード
      • Encoder–Decoder (Unequal-length): MT など

  - section_id: sec35
    heading: "ランダムユニット抑制による正則化"
    content: |
      • ドロップアウト: 隠れユニットをランダムゼロ化
      • d⁽ˡ⁾ = (乱数行列 < keep_prob)
      • a⁽ˡ⁾ ← a⁽ˡ⁾ ⊙ d⁽ˡ⁾
      • a⁽ˡ⁾ ← a⁽ˡ⁾ / keep_prob
      • テスト時は全ネットワーク使用

  - section_id: sec36
    heading: "系列生成における探索と誤り診断"
    content: |
      • ビームサーチ: 出力列の近似 argmax
      • P(y*|x) vs P(ŷ|x) で成功/失敗判定
      • 集計して探索 vs モデル誤りを分析

  - section_id: sec37
    heading: "深層ネットワークの層別活性化計算"
    content: |
      • 単一例 x の層活性化を順次計算:
        1. z¹ = W¹·x + b¹ → a¹ = g(z¹)
        2. z² = W²·a¹ + b² → a² = g(z²)
        ⋮
        L. zᴸ = Wᴸ·aᴸ⁻¹ + bᴸ → aᴸ = g(zᴸ)
      • for ℓ in 1…L ループで実装

  - section_id: sec38
    heading: "実装詳細: 順伝播と逆伝播"
    content: |
      • 順伝播:
        z⁽ˡ⁾ = W⁽ˡ⁾·a⁽ˡ⁻¹⁾ + b⁽ˡ⁾ → A⁽ˡ⁾ = g(Z⁽ˡ⁾)
      • 逆伝播:
        dZ = dA ⊙ g′(Z)
        dW = (1/m) dZ @ A_prevᵀ
        db = (1/m) sum(dZ)
        dA_prev = Wᵀ @ dZ
      • 出力層導関数例:
        dA⁽ᴸ⁾ = Y/A⁽ᴸ⁾ − (1−Y)/(1−A⁽ᴸ⁾)
      • ベクトル化とキャッシュのポイント

  - section_id: sec39
    heading: "時系列データへのRNNの応用パターン"
    content: |
      - RNNは様々な入出力形式のタスクに適用可能：
          - 一対一：入力1 → 出力1（例：画像分類）
          - 一対多：入力1 → 出力系列（例：音楽生成）
          - 多対一：入力系列 → 出力1（例：感情分析）
          - 多対多（同長）：系列長一致（例：固有表現抽出）
          - 多対多（異長）：系列長不一致（例：翻訳）
      - エンコーダ・デコーダ構造により、可変長マッピングが可能
      - 応用例：翻訳、音楽生成、意味分類など

  - section_id: sec85
    heading: "類似度学習による1ショット識別と顔認証"
    content: |
      - ワンショット学習では1枚の画像から識別が可能
      - 類似度関数 d(img1, img2) により同一人物かを判定
          - 同一人物 → 距離が小さい
          - 別人 → 距離が大きい
      - 閾値 τ に基づいて識別または「不明」と分類
      - 特徴：
          - 新しい人物にも再学習なしで対応可能
          - 少ないデータでも高精度が期待できる
      - 制約：softmax分類は識別対象数が固定でない場合に不向き
    notes: |
      - SiameseネットワークやTripletネットワークで学習
      - 少数データの人物認識に特に有効

  - section_id: sec86
    heading: "オルソゴナリゼーションと正則化の戦略"
    content: |
      - 各ハイパーパラメータが独立して性能に影響する設計が望ましい
      - アナロジー：
          - テレビの縦横調整ノブ → 独立制御
          - 車の速度と方向 → 独立制御
      - 学習段階に応じたパラメータ設計：
          - 訓練性能：ネットワーク規模、最適化手法
          - 開発性能：正則化、データ拡張
          - テスト性能：目的関数の調整
      - 早期終了：
          - 開発誤差の悪化時に訓練を停止
          - 計算資源の節約や過学習防止に有効
          - ただし正則化と最適化の目的が混在する
      - 推奨手法：
          - L2正則化でバリアンスを抑制
          - 最適化と正則化のパラメータを分離
          - λ（正則化係数）の調整が必要
      - データ拡張による正則化：
          - 水平反転、クロップ、回転などによる擬似データ生成
          - 実データより効果は劣るが計算的に安価
    notes: |
      - ハイパーパラメータ調整の透明性と診断性を向上
      - Early Stoppingは依然有用だが分離制御には課題がある

  - section_id: sec121
    heading: "顔認識におけるTriplet Lossの活用"
    content: |
      - Triplet Lossにより、顔画像の特徴量分離を学習可能
      - Triplet定義：
          - Anchor：基準画像
          - Positive：同一人物
          - Negative：別人物
      - 損失関数：
          L(A, P, N) = max(‖f(A) - f(P)‖² - ‖f(A) - f(N)‖² + α, 0)
          ※ αはマージン（例：0.2）
      - 難しいTriplet（識別困難な組）を選ぶと効果的
      - 複数枚の画像が必要なため、少数データには不向き
    notes: |
      - 主にFaceNetなどの実用システムに使用

  - section_id: sec123
    heading: "セマンティックセグメンテーションとU-Net構造"
    content: |
      - U-Netはピクセル単位でカテゴリを予測するモデル構造
      - 構成：
          - エンコーダ：畳み込みとプーリングで特徴抽出
          - デコーダ：逆畳み込みで空間解像度を復元
          - スキップ接続：詳細な空間情報をデコーダに伝搬
      - 医療画像で誕生し、一般の画像処理にも広く利用されている

  - section_id: sec124
    heading: "Dropoutによる適応的な正則化法"
    content: |
      - Dropoutは訓練中にランダムにニューロンを無効化
      - 多様なサブネットワークを学習し、特定経路への依存を低減
      - L2正則化に似た効果をもつがより柔軟
      - `keep_prob`により保持確率を設定（例：0.5や1.0）
      - 実践的注意点：
          - Dropout中は損失が確率的になるため、デバッグ時は無効化が推奨

  - section_id: sec125
    heading: "モデル評価における人間基準と理論限界"
    content: |
      - 人間レベル性能：専門家による誤差（例：0.5%）
      - ベイズ誤差の近似として扱われる
      - 誤差分析：
          - 訓練 vs 人間 → バイアス
          - 訓練 vs 開発 → バリアンス
      - モデルが人間性能に近づくほど、さらなる改善が難しくなる

  - section_id: sec126
    heading: "効率的な学習のためのバッチサイズと最適化戦略"
    content: |
      - 各最適化法：
          - バッチGD：全データ使用、安定だが遅い
          - SGD：1件ずつ、速いがノイズが多い
          - ミニバッチ：中間的（通常64〜512件）
      - バッチサイズの選定：
          - データが小さい場合はバッチGDでも可
          - 大きすぎるとメモリ効率が悪化
      - ベクトル化と並列計算で学習速度が向上

  - section_id: sec130
    heading: "基本RNNの限界と勾配消失問題"
    content: |
      - RNNは長期依存関係の保持が困難という構造的な弱点を持つ
      - 長い時系列に対し、誤差逆伝播による勾配が指数的に減衰（勾配消失）
      - これにより、初期入力が後の出力に影響を与えにくくなる
      - 例：言語モデリングや主語-動詞の一致などで顕著
      - 一方、勾配爆発も発生し得るが、これはクリッピングで緩和可能
      - 勾配消失への根本的対応には、GRUやLSTMなどの構造改良が必要

  - section_id: sec131
    heading: "勾配安定化のための重み初期化"
    content: |
      - 深層ネットワークでは重みの初期化が学習安定性に大きく影響する
      - 初期化の目的：活性値と勾配のスケールを適切に保つこと
      - 推奨手法：
          - Xavier初期化（tanh用）：分散 1/n
          - He初期化（ReLU用）：分散 2/n
      - 適切な初期化により、勾配の爆発や消失を抑制
      - 初期化の調整は通常ハイパーパラメータよりも優先度が低いが、良好な初期値が収束を加速する

  - section_id: sec96
    heading: "ResNetとスキップ接続による深層学習の安定化"
    content: |
      • 深いネットワークでは勾配消失や性能劣化が問題となる
      • ResNet（Residual Network）はスキップ接続でこれを解決
      • 残差ブロック：
          入力a[l] → 線形＋ReLU → 線形 → a[l+2]
          最後に a[l] を加算 → a[l+2] = ReLU(z[l+2] + a[l])
      • スキップ接続により情報のバイパスが可能になり、勾配の流れも改善
      • 非残差ネットは深くなるほど訓練誤差が悪化しやすい
    notes: |
      • ResNetは100層を超える深層モデルでも安定した訓練が可能
      • Heらにより提案され、広く利用されている

  - section_id: sec97
    heading: "訓練済みRNNからのシーケンスサンプリング"
    content: |
      • RNNによる言語モデルでは、訓練後に系列生成（サンプリング）が可能
      • 手順：
      1. 初期入力（例：x₁=0, a₀=0）を与える
      2. Softmax出力から最初の単語を確率的に選ぶ
      3. 次の時刻にその単語を入力として繰り返す
      • 停止条件：EOS（end-of-sequence）トークンまたは最大ステップ数
      • UNK（未知語）対処：再サンプリングやそのまま出力
    notes: |
      • 単語レベルRNNは計算効率が高く、長期依存も扱いやすい
      • 文字レベルRNNは語彙独立性が高いが計算負荷も高い

  - section_id: sec98
    heading: "評価指標における最適化と満足化"
    content: |
      • モデル評価では複数指標を考慮する必要がある
      • 例：
      • 最適化指標：最大化・最小化したい値（例：精度）
      • 満足化指標：閾値を満たせば良い（例：レイテンシ < 100ms）
      • モデル選択：
      • 満足化条件を満たす中で最適化指標が最大のものを選ぶ
      • トリガーワード検出などでは、誤検出回数などを満足化条件とする
    notes: |
      • 重み付き和よりも明示的な分離の方が解釈しやすい
      • モデル選定時のトレードオフを形式化可能

  - section_id: sec99
    heading: "トランスフォーマーにおける自己注意機構"
    content: |
      • 自己注意（Self-Attention）は、系列内の全単語間の依存を考慮する仕組み
      • 各単語から：
      • クエリ（Q）、キー（K）、バリュー（V）を線形変換で生成
      • 各クエリq³に対してすべてのキーkⁱと内積を取り、Softmaxで重み計算
      • 重み付きバリューを加重平均して出力表現A³を得る
      • 全単語に対して並列に実行可能
    notes: |
      • スケールドドット積注意：Attention(Q, K, V) = softmax(QKᵀ / √dₖ) · V
      • トランスフォーマー構造の中核となる機構

  - section_id: sec100
    heading: "セマンティックセグメンテーションとU-Netの応用"
    content: |
      • セマンティックセグメンテーションは、画像の各ピクセルにカテゴリを割り当てる
      • 応用例：
      • 自動運転：走行可能領域の検出
      • 医用画像：腫瘍や臓器の領域分離
      • モデル構造：
      • エンコーダ：特徴抽出＋空間次元縮小
      • デコーダ：転置畳み込みで解像度復元
      • 出力：ピクセルごとのクラス確率マップ
    notes: |
      • セグメンテーションは分類・検出より細かい識別が求められる
      • U-Netは医療領域だけでなく様々な画像タスクに適応可能



  - section_id: sec109
    heading: "人間の性能を超えるモデルにおける課題と観察"
    content: |
      • モデルが人間レベルの精度に達すると、誤差の解釈が難しくなる。
      • 例：人間の誤差率が0.5%、モデルが訓練0.3%、検証0.4%を達成した場合、偏りを下げるべきか分散を減らすべきか判断が難しい。
      • モデルが人間を超えると直感的な判断が通用しなくなる。
      • 構造化データ（広告、物流、融資など）ではすでに人間を上回る成果がある。
      • 一方で、視覚・音声・言語などの自然知覚系では人間の壁を超えるのが難しい。
      • 大規模データがあれば、機械は人間の目視では追えない範囲まで学習可能。
      • 機械が優位なタスクの例：広告推薦、商品の提案、交通予測、ローン審査、医療診断など。

  - section_id: sec110
    heading: "最適化における局所解と鞍点の理解"
    content: |
      • 初期の懸念は、悪い局所最適解にモデルが停滞することだった。
      • 現代では：高次元の損失関数では鞍点（鞍型の停滞点）が主であり、局所最小値は非常に稀であるとされる。
      • 高次元空間では、ある方向には増加し、別の方向には減少するような曲率が一般的。
      • 勾配降下法は平坦な領域（プラトー）で停滞しやすい。
      • 対処法：モーメンタムやAdamなどの適応型最適化手法を用いて脱出する。

  - section_id: sec111
    heading: "深層学習におけるハイパーパラメータ探索の繰り返し"
    content: |
      • 実用的な深層学習は反復的なプロセスである。
      • 初期設定（層数、ユニット数、学習率など）は事前には予測しにくい。
      • 訓練・検証・テストセットの分割が不可欠。
      • 大規模データでは検証／テストは1%ずつでも十分。
      • 検証セット：複数モデルの比較評価、テストセット：最終評価。
      • 一部のケースではテストセットを使わず検証セットを使い回すことも。

  - section_id: sec112
    heading: "分布の不一致によるリスクとデータ設計"
    content: |
      • 検証・テストセットは理想的には同一分布から取るべき。  
      • 分布が異なると、誤った目標に最適化することになり非効率。  
      • 例：特定の属性層に偏った訓練データで他属性を予測しようとすると精度が落ちる。  
      • 解決策：データ全体をシャッフルして検証・テストを同一手法で抽出する。

  - section_id: sec113
    heading: "学習データと検証データの分布差への対応"
    content: |
      • 現実には訓練と検証／テストの分布は異なる場合がある。  
      • 例：スマホ投稿の画像分類アプリでは、訓練用にはウェブ画像も使われる。  
      • 方法1：すべて混ぜてランダム分割 → 不適切な分布が影響する可能性。  
      • 方法2（推奨）：検証・テストにはターゲット分布（例：スマホ画像）のみを使用。

  - section_id: sec114
    heading: "転移学習：知識の再利用"
    content: |
      • 多データのタスクAの知識を、少データのタスクBに活用。  
      • 手順：タスクAで学習 → 出力層を置換しタスクBで微調整。  
      • Bのデータが少ない場合、初期層を凍結することも。  
      • 有効条件：入力が類似、Aの方がデータが多い、特徴が共通。  
      • 無効条件：Aのデータ量が少ない、入力形式が異なるなど。

  - section_id: sec115
    heading: "トランスフォーマーの基本構造"
    content: |
      • トランスフォーマーは系列データを並列処理する構造で、自然言語処理における基盤技術。  
      • 従来のRNN系列（LSTMなど）の制約（勾配消失・逐次性）を克服。  
      • 全体系列を一括で処理することで効率・性能を向上。

  - section_id: sec116
    heading: "注意機構による表現の獲得"
    content: |
      • セルフアテンションは各単語に文脈を与える表現を学習。  
      • マルチヘッドアテンションで多様な関係を同時に捉える。  
      • 入力＋位置エンコーディング（サイン・コサイン）で順序を表現。  
      • 残差接続と正規化により学習安定性を確保。  
      • デコーダーではマスク付きアテンションで逐次予測を模倣。

  - section_id: sec117
    heading: "トランスフォーマーにおけるエンコーダ・デコーダ構造"
    content: |
      • エンコーダは入力をマルチヘッド＋全結合層で段階的に処理。  
      • デコーダは出力を1語ずつ予測し、エンコーダの出力を参照。  
      • 各ブロックは通常n回（例：6回）繰り返される。  
      • 出力層は線形＋ソフトマックスにより次単語を予測。

  - section_id: sec118
    heading: "トランスフォーマー訓練時のマスク機構"
    content: |
      • 正解系列がある訓練時、未来単語を隠すことで逐次予測を模倣。  
      • モデルは直前までの情報で次を予測するように訓練される。  
      • BERTやDistilBERTなどの派生モデルはこの仕組みに基づく。

  - section_id: sec119
    heading: "転置畳み込みによる空間拡張"
    content: |
      • 転置畳み込みは解像度を上げる処理（例：2×2→4×4）に使われる。  
      • 入力値×フィルター → 出力空間に配置し、重なった部分を加算。  
      • セマンティックセグメンテーション（例：U-Net）などで重要な技術。

  - section_id: sec120
    heading: "音声によるトリガーワード検出"
    content: |
      • 特定の音声を検出して反応するシステム（例：「おはようアプリ起動」）
      • 音声→スペクトログラム→RNNで処理。
      • ラベルはトリガー語の直後に1、それ以外は0。
      • クラス不均衡緩和のために複数タイムステップで1を出力することもある。

  - section_id: sec132
    heading: "現実性能を意識した評価指標の修正"
    content: |
      • アルゴリズムが不適切な出力を高スコアで出した場合、評価指標を修正すべき。
      • 例：猫画像分類で不快画像が高スコアになった場合、重要事例に高いペナルティを設定。
      • 評価指標の定義（的を置く）は、学習（矢を打つ）とは別の段階である。
      • dev/testセットも現実データと合っていない場合は更新が必要。

  - section_id: sec133
    heading: "畳み込みニューラルネットワークの利点と学習法"
    content: |
      • CNNはパラメータ共有と局所接続により効率的で過学習しにくい。
      • 特徴：平行移動に不変な特性を自動的に学習できる。
      • 学習：コスト関数を定義し、勾配法（Adamなど）で最適化。
      • 一般的な構成：画像→畳み込み／プーリング→全結合→ソフトマックス。

  - section_id: sec136
    heading: "正則化と残差構造による汎化の向上"
    content: |
      • L2正則化は大きな重みを抑え、線形領域での挙動を誘導する。
      • ResNetはショートカット接続で恒等写像を学習可能とし、深層ネットでの性能劣化を防ぐ。
      • 層をまたぐ接続で深さを増しても訓練精度が維持できる。
      • シーケンスモデル（音声、翻訳、DNA、感情、動画など）との併用も多い。
      





