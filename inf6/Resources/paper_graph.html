<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0e0e16; font-family: -apple-system, system-ui, sans-serif; }
svg { width: 100%; height: 100%; }
.link { fill: none; }
.link-sim { stroke: rgba(255,255,255,0.22); stroke-width: 1.15; }
.link-dep { stroke: rgba(255,255,255,0.38); stroke-width: 1.9; }
.node-group { cursor: pointer; }
.node-label { fill: #fff; font-weight: 600; text-anchor: middle; pointer-events: none; }
.info-card {
  position: fixed; bottom: 20px; left: 20px; right: 20px; max-width: 500px; margin: 0 auto;
  background: rgba(20,20,30,0.95); border-radius: 16px; padding: 18px;
  backdrop-filter: blur(16px); display: none; color: #fff; border: 1px solid rgba(255,255,255,0.1); z-index: 10;
}
.info-card.active { display: block; }
.info-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
.info-tags { font-size: 13px; color: #999; margin-bottom: 4px; }
</style>
</head>
<body>
<svg id="graph"></svg>
<div class="info-card" id="infoCard">
  <div class="info-tags" id="infoTags"></div>
  <div class="info-title" id="infoTitle"></div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// ── シラバス = スコープフィルタ ──
// 論文のtagsがこのいずれかに一致すればスコープ内
const SYLLABUS_TAGS = new Set([
  'math','probability','linear_algebra','statistics','ml_basics','information_theory','inference',
  'optimization','regularization',
  'cnn','residual','imagenet',
  'normalization','batch_norm','layer_norm','dropout',
  'vision','vit',
  'detection','anchor-based','anchor-free',
  'segmentation','medical',
  'rnn','gru','seq2seq','attention','nmt',
  'transformer',
  'nlp','pretraining','llm','embeddings','rag','few_shot',
  'gan','vae',
  'self_supervised','representation_learning',
  'reinforcement_learning','deep_rl',
  'edge','efficient','compression','quantization','distillation','pruning',
  'distributed','federated_learning','training',
  'xai',
  'gnn','graph',
  'meta_learning',
  'audio','waveform',
  'diffusion',
  'multimodal',
  'curriculum','pytorch'
]);

function inScope(tags){
  return (tags||[]).some(t=>SYLLABUS_TAGS.has(t.toLowerCase()));
}

// ── トピック色（論文の主要タグで決定）──
const TOPIC_COLORS = {
  math:'#a855f7', probability:'#a855f7', linear_algebra:'#a855f7', statistics:'#c084fc',
  ml_basics:'#c084fc', information_theory:'#a855f7',
  optimization:'#f97316', regularization:'#14b8a6', normalization:'#14b8a6',
  cnn:'#3b82f6', residual:'#3b82f6', imagenet:'#3b82f6', vision:'#6366f1', vit:'#6366f1',
  detection:'#ef4444', segmentation:'#ec4899',
  rnn:'#06b6d4', gru:'#06b6d4', seq2seq:'#06b6d4', attention:'#0ea5e9',
  transformer:'#eab308',
  nlp:'#22c55e', pretraining:'#22c55e', llm:'#22c55e', embeddings:'#22c55e', rag:'#22c55e',
  gan:'#8b5cf6', vae:'#8b5cf6',
  self_supervised:'#a3e635', representation_learning:'#a3e635',
  reinforcement_learning:'#d97706', deep_rl:'#d97706',
  edge:'#6b7280', efficient:'#6b7280', compression:'#6b7280', quantization:'#6b7280', distillation:'#6b7280',
  distributed:'#78716c', federated_learning:'#78716c',
  xai:'#ff9900',
  gnn:'#66cc66', graph:'#66cc66',
  meta_learning:'#cc66cc',
  audio:'#996633', waveform:'#996633',
  diffusion:'#4d99e6',
  multimodal:'#e64d99',
  curriculum:'#888888', pytorch:'#888888'
};
const DEFAULT_COLOR='#888';

function nodeColor(tags){
  for(const t of (tags||[])){
    const c=TOPIC_COLORS[t.toLowerCase()];
    if(c) return c;
  }
  return DEFAULT_COLOR;
}

function primaryCategory(tags){
  for(const t of (tags||[])){
    const key=t.toLowerCase();
    if(TOPIC_COLORS[key]) return key;
  }
  return 'other';
}

function yearOf(arxivId){
  if(!arxivId)return 2018;
  const yy=parseInt(arxivId.substring(0,2),10);
  return (yy<50?2000+yy:1900+yy);
}

window.loadPapers=function(s){initGraph(JSON.parse(s))};

function initGraph(data){
  // シラバススコープでフィルタ
  const scoped=data.filter(p=>inScope(p.tags));
  const W=window.innerWidth, H=window.innerHeight;
  const categories=[...new Set(scoped.map(p=>primaryCategory(p.tags)))].sort((a,b)=>a.localeCompare(b));
  const categoryCount=Math.max(categories.length,1);
  const TARGET_FONT_PX=24;
  const MIN_FONT_PX=18;
  const MAX_LINE_WIDTH=Math.max(180, Math.min(320, ((W-240)/categoryCount)-18));
  const fontSize=TARGET_FONT_PX;
  const lineH=Math.round(fontSize*1.28);
  const charW=fontSize*0.55, charWja=fontSize*1.0;
  const maxLineW=MAX_LINE_WIDTH;

  function wrapTitle(title){
    const words=title.split(/[\s/]+/);
    const lines=[];let cur='';
    for(const w of words){
      const test=cur?cur+' '+w:w;
      const estW=[...test].reduce((s,c)=>s+(c.charCodeAt(0)>255?charWja:charW),0);
      if(estW>maxLineW&&cur){lines.push(cur);cur=w;}
      else cur=test;
    }
    if(cur)lines.push(cur);
    if(lines.length>3){lines.length=3;lines[2]=lines[2].slice(0,20)+'…';}
    return lines;
  }

  const nodes=scoped.map(p=>{
    const aid=p.arxiv_id||p.arxivId;
    const year=yearOf(aid);
    const color=nodeColor(p.tags);
    const lines=wrapTitle(p.title);
    return{id:p.id,title:p.title,tags:p.tags||[],color:color,
      arxivId:aid,year:year,lines:lines};
  });

  // リンク: タグ類似度
  const links=[];
  for(let i=0;i<nodes.length;i++){
    const tA=new Set(scoped[i].tags||[]);
    for(let j=i+1;j<nodes.length;j++){
      const tB=new Set(scoped[j].tags||[]);
      const sh=[...tA].filter(x=>tB.has(x));
      if(sh.length>=2) links.push({source:nodes[i].id,target:nodes[j].id,kind:'sim',
        strength:Math.min(sh.length/3,1)});
    }
  }

  render(nodes,links,fontSize,lineH,MIN_FONT_PX);
}

function render(nodes,links,fontSize,lineH,minFontSize){
  const svg=d3.select('#graph'),W=window.innerWidth,H=window.innerHeight;
  const g=svg.append('g');
  const zoomBeh=d3.zoom().scaleExtent([0.2,6]).on('zoom',e=>g.attr('transform',e.transform));
  svg.call(zoomBeh);

  let currentFontSize=fontSize;
  let currentLineH=lineH;
  const padLeft=160, padRight=80, padTop=120, padBottom=80;
  const years=[...new Set(nodes.map(n=>n.year))].sort((a,b)=>b-a);
  const categories=[...new Set(nodes.map(n=>primaryCategory(n.tags)))].sort((a,b)=>a.localeCompare(b));
  const categoryIndexByValue=new Map(categories.map((c,i)=>[c,i]));
  const yearCount=Math.max(years.length,1);
  const categoryCount=Math.max(categories.length,1);
  const usableW=Math.max(1, W-padLeft-padRight);
  const usableH=Math.max(1, H-padTop-padBottom);
  const cellGapX=14;
  const cellGapY=16;
  const categoryGapX=20;
  const horizontalPadRatio=0.58;
  const verticalPadRatio=0.42;

  function lineWidth(line, size){
    const ce=size*0.55, cej=size*1.0;
    return Math.max(30,[...line].reduce((s,c)=>s+(c.charCodeAt(0)>255?cej:ce),0));
  }

  function measureNodeBox(node, size, lh){
    const maxLW=Math.max(...node.lines.map(l=>lineWidth(l,size)),30);
    const pillW=maxLW+size*horizontalPadRatio*2;
    const pillH=node.lines.length*lh+size*verticalPadRatio*2;
    return { pillW, pillH };
  }

  function placeGroup(groupNodes, size, lh, availableWidth){
    const maxInnerW=Math.max(120, availableWidth-cellGapX*2);
    const gapX=Math.max(8, Math.floor(size*0.35));
    const gapY=Math.max(10, Math.floor(size*0.45));
    const items=groupNodes
      .map(node=>{
        const box=measureNodeBox(node,size,lh);
        return { node, width: box.pillW, height: box.pillH };
      })
      .sort((a,b)=>Math.max(b.width,b.height)-Math.max(a.width,a.height));
    const rows=[];
    let currentRow=[];
    let currentWidth=0;
    for(const item of items){
      const nextWidth=currentRow.length===0 ? item.width : currentWidth+gapX+item.width;
      if(currentRow.length>0 && nextWidth>maxInnerW){
        rows.push(currentRow);
        currentRow=[item];
        currentWidth=item.width;
      }else{
        currentRow.push(item);
        currentWidth=nextWidth;
      }
    }
    if(currentRow.length>0) rows.push(currentRow);

    const rowHeights=rows.map(row=>Math.max(...row.map(item=>item.height),0));
    const blockHeight=rowHeights.reduce((sum,h)=>sum+h,0)+Math.max(0,rows.length-1)*gapY;
    const blockWidth=Math.max(...rows.map(row=>row.reduce((sum,item,idx)=>sum+item.width+(idx>0?gapX:0),0)),0);

    return { rows, rowHeights, blockWidth, blockHeight, gapX, gapY };
  }

  function layoutWithFont(size){
    const lh=size*1.3;
    const groups=new Map();
    nodes.forEach(node=>{
      node._category=primaryCategory(node.tags);
      const key=`${node._category}::${node.year}`;
      if(!groups.has(key)) groups.set(key,[]);
      groups.get(key).push(node);
    });

    const placements=new Map();
    let fits=true;
    const yearHeightByValue=new Map(years.map(year=>[year, 0]));
    const groupLayoutByKey=new Map();
    const categoryWidthByValue=new Map(categories.map(category=>[category, 140]));

    nodes.forEach(node=>{
      const box=measureNodeBox(node,size,lh);
      categoryWidthByValue.set(node._category, Math.max(categoryWidthByValue.get(node._category) ?? 140, box.pillW + cellGapX*2));
    });

    groups.forEach((groupNodes,key)=>{
      const [category] = key.split('::');
      const availableWidth=categoryWidthByValue.get(category) ?? 140;
      const layout=placeGroup(groupNodes,size,lh,availableWidth);
      groupLayoutByKey.set(key, layout);
      categoryWidthByValue.set(category, Math.max(categoryWidthByValue.get(category) ?? 140, layout.blockWidth + cellGapX*2));
    });

    const totalCategoryWidth=categories.reduce((sum, category)=>sum + (categoryWidthByValue.get(category) ?? 140), 0)
      + Math.max(0, categoryCount-1)*categoryGapX;
    if(totalCategoryWidth > usableW){
      fits=false;
    }

    const categoryLeftByValue=new Map();
    let cursorCategoryLeft=padLeft + Math.max(0, (usableW-totalCategoryWidth)/2);
    categories.forEach((category, index)=>{
      categoryLeftByValue.set(category, cursorCategoryLeft);
      cursorCategoryLeft += (categoryWidthByValue.get(category) ?? 140);
      if(index < categories.length-1) cursorCategoryLeft += categoryGapX;
    });

    groups.forEach((groupNodes,key)=>{
      const [category, yearText]=key.split('::');
      const year=Number(yearText);
      const layout=groupLayoutByKey.get(key);
      yearHeightByValue.set(year, Math.max(yearHeightByValue.get(year) ?? 0, layout.blockHeight + cellGapY*2));
    });

    years.forEach(year=>{
      const minBandHeight=Math.max(lh + cellGapY*2, 84);
      yearHeightByValue.set(year, Math.max(yearHeightByValue.get(year) ?? 0, minBandHeight));
    });

    const requiredHeight=years.reduce((sum, year)=>sum + (yearHeightByValue.get(year) ?? 0), 0);
    if(requiredHeight > usableH){
      fits=false;
    }

    const remainingHeight=Math.max(0, usableH-requiredHeight);
    const betweenYearGap=yearCount>1 ? Math.min(24, remainingHeight/(yearCount-1)) : 0;
    const usedHeight=requiredHeight + betweenYearGap*Math.max(0, yearCount-1);
    const topOffset=padTop + Math.max(0, (usableH-usedHeight)/2);
    const yearTopByValue=new Map();
    let cursorYearTop=topOffset;
    years.forEach((year, index)=>{
      yearTopByValue.set(year, cursorYearTop);
      cursorYearTop += (yearHeightByValue.get(year) ?? 0);
      if(index < years.length-1) cursorYearTop += betweenYearGap;
    });

    groups.forEach((groupNodes,key)=>{
      const layout=groupLayoutByKey.get(key);
      const [category, yearText]=key.split('::');
      const year=Number(yearText);
      const categoryWidth=categoryWidthByValue.get(category) ?? 140;
      const cellLeft=categoryLeftByValue.get(category) ?? padLeft;
      const cellTop=yearTopByValue.get(year) ?? topOffset;
      const yearBandHeight=yearHeightByValue.get(year) ?? Math.max(lh + cellGapY*2, 84);
      const startX=cellLeft + (categoryWidth-layout.blockWidth)/2;
      let cursorY=cellTop + (yearBandHeight-layout.blockHeight)/2;

      layout.rows.forEach((row,rowIndex)=>{
        const rowWidth=row.reduce((sum,item,idx)=>sum+item.width+(idx>0?layout.gapX:0),0);
        let cursorX=startX + (layout.blockWidth-rowWidth)/2;
        const rowHeight=layout.rowHeights[rowIndex];
        row.forEach(item=>{
          const centerX=cursorX + item.width/2;
          const centerY=cursorY + rowHeight/2;
          placements.set(item.node.id,{
            x:centerX,
            y:centerY,
            width:item.width,
            height:item.height
          });
          cursorX += item.width + layout.gapX;
        });
        cursorY += rowHeight + layout.gapY;
      });
    });

    return { fits, placements, lineH: lh, yearTopByValue, yearHeightByValue, categoryLeftByValue, categoryWidthByValue };
  }

  let layoutResult=layoutWithFont(currentFontSize);
  while(!layoutResult.fits && currentFontSize>minFontSize){
    currentFontSize -= 1;
    layoutResult = layoutWithFont(currentFontSize);
  }
  currentLineH = layoutResult.lineH;
  const placements = layoutResult.placements;
  const yearTopByValue = layoutResult.yearTopByValue;
  const yearHeightByValue = layoutResult.yearHeightByValue;
  const categoryLeftByValue = layoutResult.categoryLeftByValue;
  const categoryWidthByValue = layoutResult.categoryWidthByValue;

  nodes.forEach(node=>{
    const placement=placements.get(node.id);
    if(!placement) return;
    node.x=placement.x;
    node.y=placement.y;
    node._pillW=placement.width;
    node._pillH=placement.height;
  });

  const guide=g.append('g').attr('class','year-guides');
  guide.selectAll('line').data(years).join('line')
    .attr('x1', padLeft-18)
    .attr('x2', W-padRight+24)
    .attr('y1', d => (yearTopByValue.get(d) ?? padTop) + ((yearHeightByValue.get(d) ?? 0)/2))
    .attr('y2', d => (yearTopByValue.get(d) ?? padTop) + ((yearHeightByValue.get(d) ?? 0)/2))
    .attr('stroke', 'rgba(255,255,255,0.08)')
    .attr('stroke-width', 1);
  guide.selectAll('text').data(years).join('text')
    .attr('x', 18)
    .attr('y', d => (yearTopByValue.get(d) ?? padTop) + ((yearHeightByValue.get(d) ?? 0)/2))
    .attr('fill', 'rgba(255,255,255,0.78)')
    .attr('font-size', Math.max(16, Math.min(24, currentFontSize*0.9)))
    .attr('font-weight', 700)
    .attr('dominant-baseline', 'middle')
    .text(d => `${d}`);

  const categoryGuide=g.append('g').attr('class','category-guides');
  categoryGuide.selectAll('text').data(categories).join('text')
    .attr('x', d => (categoryLeftByValue.get(d) ?? padLeft) + ((categoryWidthByValue.get(d) ?? 140)/2))
    .attr('y', 34)
    .attr('fill', 'rgba(255,255,255,0.84)')
    .attr('font-size', Math.max(18, Math.min(28, currentFontSize)))
    .attr('font-weight', 700)
    .attr('text-anchor', 'middle')
    .text(d => d.replaceAll('_',' '));

  // 曲線リンク
  const link=g.append('g').selectAll('path').data(links).join('path')
    .attr('class',d=>'link link-sim');

  // ノードグループ
  const node=g.append('g').selectAll('g').data(nodes).join('g').attr('class','node-group');

  function balloonPath(width,height){
    const hw=width/2;
    const hh=height/2;
    const corner=Math.min(hh*0.9, Math.max(12, currentFontSize*0.9));
    const bulge=Math.min(width*0.08, 22);
    return [
      `M ${-hw+corner} ${-hh}`,
      `H ${hw-corner}`,
      `C ${hw+bulge} ${-hh} ${hw+bulge} ${hh} ${hw-corner} ${hh}`,
      `H ${-hw+corner}`,
      `C ${-hw-bulge} ${hh} ${-hw-bulge} ${-hh} ${-hw+corner} ${-hh}`,
      'Z'
    ].join(' ');
  }

  // バルーン
  node.each(function(d){
    d3.select(this).append('path').attr('class','node-pill')
      .attr('d', balloonPath(d._pillW,d._pillH))
      .attr('fill',d.color+'30')
      .attr('stroke',d.color).attr('stroke-width',1);
  });

  // 複数行テキスト
  node.each(function(d){
    const totalH=d.lines.length*currentLineH;
      d.lines.forEach((line,i)=>{
        d3.select(this).append('text').attr('class','node-label')
        .attr('font-size',currentFontSize+'px')
        .attr('x',0).attr('y',-totalH/2+currentLineH/2+i*currentLineH)
        .attr('dominant-baseline','central')
        .text(line);
    });
  });

  // 隣接マップ
  const neighbors=new Map();
  nodes.forEach(n=>neighbors.set(n.id,new Set()));
  links.forEach(l=>{
    const sid=typeof l.source==='object'?l.source.id:l.source;
    const tid=typeof l.target==='object'?l.target.id:l.target;
    neighbors.get(sid).add(tid); neighbors.get(tid).add(sid);
  });

  // タップハイライト
  let selId=null;
  function updateHighlight(){
    const card=document.getElementById('infoCard');
    if(selId){
      const nb=neighbors.get(selId)||new Set();
      link.attr('stroke',l=>{
        const sid=l.source.id||l.source, tid=l.target.id||l.target;
        return(sid===selId||tid===selId)?'#3b9dff':null;
      }).attr('stroke-width',l=>{
        const sid=l.source.id||l.source, tid=l.target.id||l.target;
        return(sid===selId||tid===selId)?2.5:null;
      }).attr('stroke-opacity',l=>{
        const sid=l.source.id||l.source, tid=l.target.id||l.target;
        return(sid===selId||tid===selId)?1:0.08;
      });
      node.each(function(n){
        const pill=d3.select(this).select('.node-pill');
        if(n.id===selId){
          pill.attr('stroke','#fff').attr('stroke-width',2.5);
          d3.select(this).attr('opacity',1);
        }else if(nb.has(n.id)){
          pill.attr('stroke','#3b9dff').attr('stroke-width',2.5);
          d3.select(this).attr('opacity',1);
        }else{
          pill.attr('stroke',n.color).attr('stroke-width',1);
          d3.select(this).attr('opacity',0.15);
        }
      });
      const sel=nodes.find(n=>n.id===selId);
      if(sel){
        card.classList.add('active');
        document.getElementById('infoTitle').textContent=sel.title;
        document.getElementById('infoTags').textContent=sel.tags.join(' · ');
        if(window.webkit&&window.webkit.messageHandlers.paperTap)
          window.webkit.messageHandlers.paperTap.postMessage(sel.id);
      }
    }else{
      link.attr('stroke',null).attr('stroke-width',null).attr('stroke-opacity',null);
      node.each(function(n){
        d3.select(this).select('.node-pill').attr('stroke',n.color).attr('stroke-width',1);
        d3.select(this).attr('opacity',1);
      });
      card.classList.remove('active');
    }
  }
  node.on('click',(e,d)=>{e.stopPropagation();selId=selId===d.id?null:d.id;updateHighlight();});
  svg.on('click',()=>{selId=null;updateHighlight();});

  link.attr('d',d=>{
    const source=typeof d.source==='object'?d.source:nodes.find(n=>n.id===d.source);
    const target=typeof d.target==='object'?d.target:nodes.find(n=>n.id===d.target);
    const sx=source.x,sy=source.y,tx=target.x,ty=target.y;
    const dx=tx-sx,dy=ty-sy;
    const dist=Math.sqrt(dx*dx+dy*dy)||1;
    const off=Math.min(dist*0.18,44);
    const mx=(sx+tx)/2,my=(sy+ty)/2;
    const nx=-dy/dist*off,ny=dx/dist*off;
    return `M${sx},${sy} Q${mx+nx},${my+ny} ${tx},${ty}`;
  });
  node.attr('transform',d=>`translate(${d.x},${d.y})`);
}
</script>
</body>
</html>
