<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>inf6 Knowledge Map</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%;
  min-height: 100%;
  overflow-x: hidden;
  overflow-y: auto;
  background: #f7f6f0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-overflow-scrolling: touch;
}
svg { display: block; }
.tooltip {
  position: absolute;
  display: none;
  z-index: 10;
  max-width: 340px;
  padding: 10px 12px;
  border: 1px solid rgba(21, 31, 45, 0.16);
  border-radius: 6px;
  background: #fff;
  color: #172033;
  font-size: 13px;
  line-height: 1.45;
  pointer-events: none;
  box-shadow: 0 12px 28px rgba(21, 31, 45, 0.16);
}
</style>
</head>
<body>
<div class="tooltip" id="tooltip"></div>
<svg id="board"></svg>

<script src="d3.v7.min.js"></script>
<script>
'use strict';

const BG = '#f5f4ee';
const TEXT = '#1e293b';
const MUTED = '#94a3b8';
const MARGIN = { top: 44, right: 24, bottom: 70, left: 24 };
const NODE_FIELD_HALF_WIDTH = 250;
const PAPER_NODE_GAP = 28;
let PAPER_FONT = 15;

// 分類色：色相を均等分散し、同系色の衝突を排除
const CLASSIFICATION_RULES = [
  { id: 'mathematics-statistics',   color: '#1d4ed8', terms: ['mathematics-statistics', '数学', '統計', '確率', '線形代数', 'linear-algebra', 'probability', 'statistics', 'matrix'] },
  { id: 'machine-learning',         color: '#0f766e', terms: ['machine-learning', '機械学習', '教師あり', '教師なし', '最適化', '正則化', '正規化', '活性化', '損失', '誤差', 'モデルの解釈性', 'モデルの軽量化', 'メタ学習', 'optimization', 'normalization', 'regularization'] },
  { id: 'deep-learning',            color: '#6d28d9', terms: ['deep-learning', '深層学習', 'ディープラーニング', 'ニューラル', 'cnn', 'rnn', 'transformer', 'attention', '画像認識', '物体検出', 'セグメンテーション', '自然言語', '生成モデル', 'gan', 'vae', '拡散', '音声処理', 'マルチモーダル', '全結合', '畳み込み', '正規化層', 'プーリング', 'スキップ結合', '回帰結合', 'オートエンコーダ', 'データ生成', '転移学習', 'ファインチューニング'] },
  { id: 'reinforcement-learning',   color: '#b45309', terms: ['reinforcement-learning', '強化学習', 'reinforcement', 'dqn', 'ppo', 'a3c', 'sac', 'td3'] },
  { id: 'graph-learning',           color: '#0369a1', terms: ['graph-learning', 'グラフ', 'graph', 'gnn', 'gcn', 'gat'] },
  { id: 'responsible-ai-governance',color: '#9f1239', terms: ['responsible-ai-governance', '説明可能', 'xai', 'ＸＡＩ', 'ガバナンス', '倫理', '著作権', '個人情報', '公平性', '透明性', '安全', 'セキュリティ', '悪用', '民主主義', '環境保護', '労働', 'プライバシー', '特許', '契約', '法', 'ガイドライン', '重要な価値'] },
  { id: 'systems-implementation',   color: '#374151', terms: ['systems-implementation', '実装', 'pytorch', '圧縮', '分散', 'エッジ', 'モデルの選択', '評価', 'データ', 'プロジェクト', '収集', '加工', '分析'] },
  { id: 'azure-ai-services',        color: '#0284c7', terms: ['azure-ai-services', 'ai-102', 'azure', 'microsoft-learn', 'speech', 'vision', 'language', 'search', 'document'] },
  { id: 'ai-foundations',           color: '#92400e', terms: ['ai-foundations', '人工知能', '探索', '推論', '知識表現', 'エキスパートシステム'] }
];

let domains = [];
let bands = [];
let nodes = [];
let papers = [];
let edges = [];
let svg;
let boardG;
let tip;
let W = 900;
let H = 700;
let mode = 'all';
let selectedID = null;
let resizeTimer = null;
let measureCanvas = null;

window.loadCircuitBoard = function(jsonStr) {
  try {
    const parsed = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
    domains = Array.isArray(parsed) ? parsed : [parsed];
    build();
    render();
  } catch (error) {
    console.error('[CircuitBoard] parse failed:', error);
    domains = [];
    renderError(String(error?.message || error));
  }
};

function init() {
  svg = d3.select('#board');
  tip = d3.select('#tooltip');
  window.addEventListener('resize', () => {
    if (!domains.length) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      build();
      render();
    }, 80);
  });
  svg.on('click', (event) => {
    if (event.target === svg.node() || event.target.classList?.contains('background')) {
      mode = 'all';
      selectedID = null;
      updateVisibility();
    }
  });
}

function build() {
  W = Math.max(360, window.innerWidth || 900);
  const laneWidth = Math.max(80, W / 2 - NODE_FIELD_HALF_WIDTH - PAPER_NODE_GAP - MARGIN.left - 10);
  const targetChars = 22; // 日本語20〜25文字を基準
  PAPER_FONT = Math.round(Math.max(12, Math.min(18, laneWidth / (targetChars * 0.62))));
  bands = [];
  nodes = [];
  papers = [];
  edges = [];

  const graph = buildGlobalNetwork(domains);
  nodes = graph.nodes;
  papers = graph.papers;
  edges = graph.edges;
  bands = graph.classifications;
  H = graph.height;

  // Extend SVG height to fit all placed nodes (they may exceed time-axis height
  // when many nodes share the same year).
  if (nodes.length) {
    const maxNodeBottom = Math.max(...nodes.map((n) => n.y + (n.visualRadius || n.radius) + 24));
    H = Math.max(H, maxNodeBottom);
  }
}

function buildGlobalNetwork(sourceDomains) {
  const errors = validateRenderableData(sourceDomains);
  if (errors.length) {
    throw new Error(errors.join('\n'));
  }
  const allNodes = sourceDomains.flatMap(d => d.nodes || []);
  const concepts = allNodes.filter(isConceptNode);
  console.log('[CircuitBoard] total nodes:', allNodes.length, 'concepts:', concepts.length, 'papers:', sourceDomains.flatMap(d => d.papers || []).length);

  const conceptByKey = new Map();
  const conceptKeyByRawNodeID = new Map();
  const conceptKeysByPaperID = new Map();
  const paperByID = new Map();
  const graphEdges = [];

  sourceDomains.forEach((domain) => {
    const rawNodes = (Array.isArray(domain.nodes) ? domain.nodes : []).filter(isConceptNode);
    rawNodes.forEach((raw) => {
      const classID = raw.classification_id;
      const conceptKey = conceptIdentityKey(raw);
      const concept = ensureConcept(conceptByKey, raw, conceptKey, classID);
      conceptKeyByRawNodeID.set(raw.node_id, conceptKey);
      concept.rawNodes.push(raw);
      mergeYears(concept.years, yearsFromObject(raw));
      concept.titles.add(nodeTitle(raw));
      (raw.linked_paper_ids || []).forEach((paperID) => {
        if (!conceptKeysByPaperID.has(paperID)) conceptKeysByPaperID.set(paperID, new Set());
        conceptKeysByPaperID.get(paperID).add(conceptKey);
      });
    });
  });

  sourceDomains.forEach((domain) => {
    const rawPapers = Array.isArray(domain.papers) ? domain.papers : [];
    rawPapers.forEach((paper) => {
      const paperID = paper.paper_id || paper.paper_title;
      const linkedConceptKeys = uniqueStrings((paper.syllabus_node_ids || []).map((id) => conceptKeyByRawNodeID.get(id)).filter(Boolean));
      const reverseLinkedConceptKeys = Array.from(conceptKeysByPaperID.get(paperID) || []);
      const conceptKeys = linkedConceptKeys.length ? linkedConceptKeys : reverseLinkedConceptKeys;
      const existing = paperByID.get(paperID);
      const item = existing || {
        id: `paper:${paperID}`,
        rawID: paperID,
        title: paperTitle(paper),
        paper,
        years: new Set(),
        conceptKeys: new Set(),
        kind: 'paper'
      };
      mergeYears(item.years, yearsFromObject(paper));
      conceptKeys.forEach((conceptKey) => item.conceptKeys.add(conceptKey));
      paperByID.set(paperID, item);
    });
  });

  const paperLinkedConceptKeys = new Set();
  const paperCountByConceptKey = new Map();
  paperByID.forEach((paper) => {
    paper.conceptKeys.forEach((conceptKey) => {
      if (conceptByKey.has(conceptKey)) {
        paperLinkedConceptKeys.add(conceptKey);
        paperCountByConceptKey.set(conceptKey, (paperCountByConceptKey.get(conceptKey) || 0) + 1);
      }
    });
  });
  const conceptNodes = Array.from(conceptByKey.values())
    .filter((concept) => paperLinkedConceptKeys.has(concept.id))
    .map((concept) => finalizeConcept(concept, paperCountByConceptKey.get(concept.id) || 0));
  const renderableConceptByKey = new Map(conceptNodes.map((concept) => [concept.id, concept]));
  const paperItems = Array.from(paperByID.values()).map((paper) => finalizePaper(paper, renderableConceptByKey));
  applyAchievementSourcesFromPapers(conceptNodes, paperItems);
  validateBuiltGraph(conceptNodes, paperItems);

  // 概念ノードを先に配置してサイド（左右）を確定させる
  placeConceptNodes(conceptNodes);

  // 年×サイド別の最大論文数を事前集計 → yearStepを論文密度から逆算
  const rowGap = PAPER_FONT + 6;
  const conceptByIDPre = new Map(conceptNodes.map((n) => [n.id, n]));
  const centerXPre = W / 2;
  const yearSideBuckets = new Map();
  paperItems.forEach((paper, idx) => {
    const pNode = conceptByIDPre.get(paper.conceptKeys[0]);
    const side = pNode ? (pNode.x >= centerXPre ? 1 : -1) : (idx % 2 === 0 ? -1 : 1);
    const key = `${paper.time.value}:${side}`;
    yearSideBuckets.set(key, (yearSideBuckets.get(key) || 0) + 1);
  });
  const yearHeights = buildYearHeights(paperItems, yearSideBuckets, rowGap);
  const timeScale = buildTimeScale(paperItems, yearHeights);
  const height = timeScale.height;

  placePaperLanes(paperItems, conceptNodes, timeScale, rowGap);

  sourceDomains.forEach((domain) => {
    const rawNodes = (Array.isArray(domain.nodes) ? domain.nodes : []).filter(isConceptNode);
    rawNodes.forEach((raw) => {
      const fromKey = raw.parent_node_id ? conceptKeyByRawNodeID.get(raw.parent_node_id) : null;
      const toKey = conceptKeyByRawNodeID.get(raw.node_id);
      if (fromKey && toKey && fromKey !== toKey && renderableConceptByKey.has(fromKey) && renderableConceptByKey.has(toKey)) {
        graphEdges.push(edgeRecord(fromKey, toKey, 'concept', toKey));
      }
    });
    (domain.edges || []).forEach((edge) => {
      const fromKey = conceptKeyByRawNodeID.get(edge.from_node_id);
      const toKey = conceptKeyByRawNodeID.get(edge.to_node_id);
      if (fromKey && toKey && fromKey !== toKey && renderableConceptByKey.has(fromKey) && renderableConceptByKey.has(toKey)) {
        graphEdges.push(edgeRecord(fromKey, toKey, 'concept', toKey));
      }
    });
  });

  // 論文は全リンク先ノードにエッジを張る（どのノードをタップしても関連論文が浮かぶ）
  paperItems.forEach((paper) => {
    paper.conceptKeys.forEach((conceptKey) => {
      if (renderableConceptByKey.has(conceptKey)) graphEdges.push(edgeRecord(conceptKey, paper.id, 'paper', conceptKey));
    });
  });

  return {
    nodes: conceptNodes,
    papers: paperItems,
    edges: uniqueEdges(graphEdges),
    classifications: conceptNodes.map((node) => ({
      id: node.id,
      color: node.color,
      top: node.y - node.radius,
      height: node.radius * 2,
      label: node.title,
      time: node.time
    })),
    height
  };
}

function validateRenderableData(sourceDomains) {
  const errors = [];
  sourceDomains.forEach((domain, domainIndex) => {
    const rawNodes = (Array.isArray(domain.nodes) ? domain.nodes : []).filter(isConceptNode);
    rawNodes.forEach((node) => {
      if (!node.classification_id) errors.push(`classification_id missing: node ${node.node_id} domain#${domainIndex}`);
      if (node.classification_id && !scienceColorFor(node.classification_id, nodeTitle(node), false)) {
        errors.push(`science color rule missing: node ${node.node_id} classification ${node.classification_id}`);
      }
    });
    const rawPapers = Array.isArray(domain.papers) ? domain.papers : [];
    rawPapers.forEach((paper, paperIndex) => {
      const id = paper.paper_id || paper.paper_title || `paper#${paperIndex}`;
      if (!paper.classification_id && !(Array.isArray(paper.syllabus_node_ids) && paper.syllabus_node_ids.length)) {
        errors.push(`classification_id missing: paper ${id} domain#${domainIndex}`);
      }
      if (!yearsFromObject(paper).length) {
        const domainYear = yearsFromObject(domain);
        if (domainYear.length) {
          paper.source_year = Math.max(...domainYear);
          paper.source_years = domainYear;
        } else {
          paper.source_year = new Date().getFullYear();
        }
      }
    });
  });
  return errors;
}

function validateBuiltGraph(conceptNodes, paperItems) {
  if (!conceptNodes.length) throw new Error('concept data missing: no concept nodes to render');
  if (!paperItems.length) throw new Error('paper data missing: no linked papers to render');
  const visiblePapers = paperItems.filter((paper) => paper.title && Number.isFinite(paper.time?.value));
  if (!visiblePapers.length) throw new Error('paper data missing: no visible paper labels to render');
}

function ensureConcept(conceptByKey, raw, conceptKey, classID) {
  const existing = conceptByKey.get(conceptKey);
  if (existing) return existing;
  const title = nodeTitle(raw);
  const color = scienceColorFor(classID, title, true);
  const concept = {
    id: conceptKey,
    rawID: raw.node_id,
    raw,
    title,
    classID,
    titles: new Set(),
    rawNodes: [],
    years: new Set(),
    color,
    kind: 'concept'
  };
  conceptByKey.set(conceptKey, concept);
  return concept;
}

function finalizeConcept(concept, paperCount) {
  const years = Array.from(concept.years).sort((a, b) => a - b);
  const maxYear = years.length ? Math.max(...years) : null;
  const time = maxYear !== null
    ? { known: true, value: maxYear, label: String(maxYear) }
    : { known: false, value: null, label: '時期不明' };
  const title = selectConceptTitle(concept);
  const radius = fieldRadius(paperCount, concept.rawNodes.length);
  const label = fitNodeLabelToRadius(nodeLabel(title), radius);
  const achievementValues = concept.rawNodes.map((raw) => raw.achievement);
  const achievement = aggregateAchievement(achievementValues);
  const achievementSources = aggregateAchievementSources(concept.rawNodes);
  return {
    ...concept,
    title,
    label,
    achievement,
    achievementSources,
    achievementFraction: achievementAverage(achievementValues),
    paperCount,
    radius,
    time,
    years
  };
}

function finalizePaper(paper, conceptByKey) {
  const years = Array.from(paper.years).sort((a, b) => a - b);
  const conceptKeys = Array.from(paper.conceptKeys).filter((conceptKey) => conceptByKey.has(conceptKey));
  if (!conceptKeys.length) {
    throw new Error(`paper has no renderable classification: ${paper.rawID}`);
  }
  return {
    ...paper,
    conceptKeys,
    color: conceptByKey.get(conceptKeys[0]).color,
    achievement: paper.paper?.achievement || 'not_started',
    achievementFraction: achievementFraction(paper.paper?.achievement || 'not_started'),
    time: { known: true, value: Math.max(...years), label: String(Math.max(...years)) },
    years
  };
}

function applyAchievementSourcesFromPapers(conceptNodes, paperItems) {
  const byConcept = new Map(conceptNodes.map((node) => [
    node.id,
    { paper_total: 0, assets: 0, overview: 0, formula: 0, quiz: 0, added_explanation: 0 }
  ]));

  paperItems.forEach((paper) => {
    const paperSources = achievementSourcesForPaper(paper.paper || {});
    paper.conceptKeys.forEach((conceptKey) => {
      const target = byConcept.get(conceptKey);
      if (!target) return;
      target.paper_total += 1;
      target.assets += paperSources.assets;
      target.overview += paperSources.overview;
      target.formula += paperSources.formula;
      target.quiz += paperSources.quiz;
      target.added_explanation += paperSources.added_explanation;
    });
  });

  conceptNodes.forEach((node) => {
    node.achievementSources = byConcept.get(node.id) || node.achievementSources;
  });
}

function achievementSourcesForPaper(paper) {
  return {
    assets: paper.assets_pipeline_state === 'finished' ? 1 : 0,
    overview: paper.overview_state === 'generated' ? 1 : 0,
    formula: paper.formula_state === 'created' || paper.formula_state === 'explained' ? 1 : 0,
    quiz: paper.quiz_state === 'generated' ? 1 : 0,
    added_explanation: paper.added_explanation_state === 'generated' ? 1 : 0
  };
}

function conceptIdentityKey(raw) {
  const title = nodeTitle(raw)
    .replace(/[（）()]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
  return `concept:${title || raw.node_id}`;
}

function buildYearHeights(paperItems, yearSideBuckets, rowGap) {
  const years = [...new Set(paperItems.map((item) => item.time.value).filter(Number.isFinite))];
  const out = new Map();
  years.forEach((year) => {
    const leftCount = yearSideBuckets.get(`${year}:-1`) || 0;
    const rightCount = yearSideBuckets.get(`${year}:1`) || 0;
    const rows = Math.max(leftCount, rightCount, 1);
    out.set(year, rows * rowGap + 12);
  });
  return out;
}

function buildTimeScale(paperItems, yearHeights) {
  // 論文が実在する年だけをインデックス化し、空白年を詰める
  const allYears = paperItems.map((item) => item.time.value).filter(Number.isFinite);
  const uniqueYears = [...new Set(allYears)].sort((a, b) => b - a); // 新→旧
  const yearOffset = new Map();
  const top = MARGIN.top + 88;
  let y = top;
  uniqueYears.forEach((year) => {
    yearOffset.set(year, y);
    y += yearHeights.get(year) || 36;
  });
  const height = Math.max(760, y + 180);
  return {
    minYear: uniqueYears.at(-1) ?? 2020,
    maxYear: uniqueYears[0] ?? 2020,
    uniqueYears,
    top,
    height,
    yForYear(year) {
      return yearOffset.get(year) ?? y;
    }
  };
}

// Vertical helix layout (cylinder seen from the side):
//   Y: monotonically increases   →  vertical scroll fits any N
//   X: oscillates sinusoidally around the center axis
// Fixed node size, O(n) placement, no collision check needed.
function placeConceptNodes(conceptNodes) {
  if (!conceptNodes.length) return;
  const ordered = neighborhoodOrder(conceptNodes);
  const centerX = W / 2;
  const amplitude = Math.max(60, Math.min(150, NODE_FIELD_HALF_WIDTH * 0.55));

  // One full revolution every ~6 nodes → roughly looks like a coil.
  const nodesPerTurn = 6;
  const angleStep = (2 * Math.PI) / nodesPerTurn;

  // Vertical step: ensure no overlap when two nodes are at the same X side.
  // The closest neighbors at the same X (nodesPerTurn apart) must be separated
  // by ≥ node diameter vertically. Adjacent nodes are also at different X by
  // 2*amplitude*sin(angleStep/2), so the diagonal distance check matters too.
  const yStep = Math.max(FIXED_NODE_RADIUS * 0.95, FIXED_NODE_RADIUS * 1.6 / nodesPerTurn * 2);

  const startY = MARGIN.top + 80 + FIXED_NODE_RADIUS;
  ordered.forEach((node, index) => {
    node.helixIndex = index;
    node.visualRadius = FIXED_NODE_RADIUS;
    node.visualOpacity = 1.0;

    const phase = index * angleStep;
    node.x = centerX + amplitude * Math.sin(phase);
    node.y = startY + index * yStep;
    node.helixPhase = phase % (2 * Math.PI);
    node.helixDepth = 0.5;
  });
}

// 近傍距離：行間の端から端の隙間（px）。
function neighborGap(a, b) {
  if (a.classID !== b.classID) return 10;  // 分類境界
  const ap = a.raw?.parent_node_id;
  const bp = b.raw?.parent_node_id;
  if (ap === b.rawID || bp === a.rawID) return 3;   // 親子
  if (ap && ap === bp) return 4;                     // 兄弟
  if (sameCluster(a, b)) return 5;                   // クラスター
  return 6;                                          // 同分類・遠縁
}

// 共通祖先が2世代以内ならクラスターとみなす
function sameCluster(a, b) {
  const ancestors = (node, depth) => {
    const result = new Set();
    let cur = node.raw?.parent_node_id;
    for (let i = 0; i < depth && cur; i++) {
      result.add(cur);
      cur = undefined; // raw参照なし、IDのみで判定
    }
    return result;
  };
  const aAnc = new Set();
  let cur = a.raw?.parent_node_id;
  for (let i = 0; i < 2 && cur; i++) { aAnc.add(cur); cur = null; }
  cur = b.raw?.parent_node_id;
  for (let i = 0; i < 2 && cur; i++) { if (aAnc.has(cur)) return true; cur = null; }
  return false;
}

// 各ノードの子孫数をDFSで集計
function countDescendants(nodes) {
  const byID = new Map(nodes.map((n) => [n.rawID, n]));
  const childrenOf = new Map();
  nodes.forEach((node) => {
    const pid = node.raw?.parent_node_id;
    if (pid && byID.has(pid)) {
      if (!childrenOf.has(pid)) childrenOf.set(pid, []);
      childrenOf.get(pid).push(node.rawID);
    }
  });
  const memo = new Map();
  function dfs(id) {
    if (memo.has(id)) return memo.get(id);
    const n = (childrenOf.get(id) || []).reduce((s, cid) => s + 1 + dfs(cid), 0);
    memo.set(id, n);
    return n;
  }
  nodes.forEach((n) => dfs(n.rawID));
  return memo;
}

// 近傍評価順序：CLASSIFICATION_RULES定義順でグループ化し、各グループ内は接続グラフBFS順。
function neighborhoodOrder(nodes) {
  const classRuleOrder = CLASSIFICATION_RULES.map((r) => r.id);
  const classRank = (id) => { const i = classRuleOrder.indexOf(id); return i >= 0 ? i : 999; };

  const byClass = new Map();
  nodes.forEach((node) => {
    const cls = node.classID || 'unknown';
    if (!byClass.has(cls)) byClass.set(cls, []);
    byClass.get(cls).push(node);
  });

  const result = [];
  Array.from(byClass.keys())
    .sort((a, b) => classRank(a) - classRank(b))
    .forEach((cls) => {
      result.push(...bfsOrder(byClass.get(cls)));
    });
  return result;
}

// 接続グラフBFS順：親→子の階層順でノードを並べる。
function bfsOrder(nodes) {
  const byID = new Map(nodes.map((n) => [n.rawID, n]));
  const childrenOf = new Map();
  const hasParent = new Set();
  nodes.forEach((node) => {
    const parentID = node.raw?.parent_node_id;
    if (parentID && byID.has(parentID)) {
      if (!childrenOf.has(parentID)) childrenOf.set(parentID, []);
      childrenOf.get(parentID).push(node);
      hasParent.add(node.rawID);
    }
  });
  const roots = nodes.filter((n) => !hasParent.has(n.rawID))
    .sort((a, b) => a.title.localeCompare(b.title, window.__cbLang || 'ja'));
  const visited = new Set();
  const result = [];
  const stack = [...roots].reverse();
  while (stack.length) {
    const node = stack.pop();
    if (visited.has(node.rawID)) continue;
    visited.add(node.rawID);
    result.push(node);
    const children = (childrenOf.get(node.rawID) || [])
      .sort((a, b) => a.title.localeCompare(b.title, window.__cbLang || 'ja'));
    for (let i = children.length - 1; i >= 0; i--) stack.push(children[i]);
  }
  return result;
}

function resolveConceptCollisions(items) {
  const centerX = W / 2;
  for (let pass = 0; pass < 12; pass += 1) {
    let moved = false;
    for (let i = 0; i < items.length; i += 1) {
      for (let j = i + 1; j < items.length; j += 1) {
        const a = items[i];
        const b = items[j];
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const rA = a.visualRadius || a.radius;
        const rB = b.visualRadius || b.radius;
        const min = rA + rB + 4;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist > 0 && dist < min) {
          const push = (min - dist) / 2;
          // 同じ行ペアは横に押す、異なる行は下に押す
          const samePair = Math.abs(a.helixIndex - b.helixIndex) === 1 &&
                           Math.min(a.helixIndex, b.helixIndex) % 2 === 0;
          if (samePair) {
            const sx = dx >= 0 ? 1 : -1;
            a.x -= sx * push;
            b.x += sx * push;
          } else {
            const sy = dy >= 0 ? 1 : -1;
            b.y += sy * push;
          }
          moved = true;
        }
      }
    }
    items.forEach((item) => {
      item.x = clamp(item.x, centerX - NODE_FIELD_HALF_WIDTH + 8, centerX + NODE_FIELD_HALF_WIDTH - 8);
      item.y = Math.max(MARGIN.top + 64 + (item.visualRadius || item.radius), item.y);
    });
    if (!moved) break;
  }
}

function placePaperLanes(items, conceptNodes, timeScale, rowGap) {
  const conceptByID = new Map(conceptNodes.map((n) => [n.id, n]));
  const centerX = W / 2;
  const ordered = items.sort((a, b) => b.time.value - a.time.value || a.title.localeCompare(b.title));
  const leftStart = MARGIN.left + 10;
  const leftLabelEnd = Math.max(leftStart + 80, centerX - NODE_FIELD_HALF_WIDTH - PAPER_NODE_GAP);
  const leftWireEnd = centerX - NODE_FIELD_HALF_WIDTH;
  const rightStart = centerX + NODE_FIELD_HALF_WIDTH + PAPER_NODE_GAP;
  const rightWireStart = centerX + NODE_FIELD_HALF_WIDTH;
  const rightEnd = W - MARGIN.right - 10;
  const leftYearCount = new Map();
  const rightYearCount = new Map();
  ordered.forEach((paper, index) => {
    // 論文はリンク先概念ノードと同じ側に配置する
    const primaryNode = conceptByID.get(paper.conceptKeys[0]);
    const side = primaryNode ? (primaryNode.x >= centerX ? 1 : -1) : (index % 2 === 0 ? -1 : 1);
    const yearCounts = side < 0 ? leftYearCount : rightYearCount;
    const count = yearCounts.get(paper.time.value) || 0;
    yearCounts.set(paper.time.value, count + 1);
    const baseY = timeScale.yForYear(paper.time.value) + count * rowGap;
    paper.side = side;
    paper.y = clamp(baseY, MARGIN.top + 74, timeScale.height - MARGIN.bottom - 28);
    paper.x = side < 0 ? leftWireEnd : rightWireStart;
    paper.lineStartX = side < 0 ? leftStart : rightStart;
    paper.labelEndX = side < 0 ? leftLabelEnd : rightEnd;
    paper.lineEndX = side < 0 ? leftWireEnd : rightEnd;
    paper.wireStartX = side < 0 ? leftLabelEnd : rightWireStart;
    paper.labelWidth = Math.max(40, Math.abs(paper.labelEndX - paper.lineStartX));
  });
}

function uniqueEdges(items) {

function scienceColorFor(classID, title, shouldThrow) {
  const haystack = `${classID || ''} ${title || ''}`.toLowerCase();
  const rule = CLASSIFICATION_RULES.find((candidate) => candidate.terms.some((term) => haystack.includes(term.toLowerCase())));
  if (rule) return rule.color;
  if (shouldThrow) throw new Error(`science color rule missing: ${classID || title}`);
  return null;
}

function isSyllabusMaintenanceNode(node) {
  const text = [
    node.node_id,
    node.title_ja,
    node.title_en,

  return /シラバス|キーワード内容を見直し|キーワードの一部見直し|新規作成|syllabus\s+2024|review\s+(the\s+)?following\s+keyword|review\s+some\s+of\s+the\s+following\s+keywords|newly\s+created/i.test(text);

// Lazy build of paper-to-concept edges. Call from JS (e.g. on user gesture).
window.setPaperEdgesVisible = function(visible) {
  if (visible && !_paperEdgesBuilt) {
    edges.forEach((edge) => {
      if (edge.kind !== 'paper') return;
      const from = itemByID(edge.from);
      const to = itemByID(edge.to);
      if (!from || !to) return;
      const fromRadius = from.visualRadius || from.radius || 0;
      const bendX = to.side < 0 ? Math.min(from.x - fromRadius - 18, to.wireStartX || to.lineEndX) : Math.max(from.x + fromRadius + 18, to.wireStartX || to.lineStartX);
      const startX = to.wireStartX || (to.side < 0 ? to.lineEndX : to.lineStartX);
      boardG.append('path')
        .attr('class', 'edge paper-edge')
        .attr('data-from', edge.from)
        .attr('data-to', edge.to)
        .attr('data-dom', edge.domIndex)
        .attr('d', `M${from.x},${from.y} L${bendX},${to.y} L${startX},${to.y}`)
        .attr('fill', 'none')
        .attr('stroke', from.color)
        .attr('stroke-width', 1.15)
        .attr('stroke-opacity', 0.34)
        .attr('stroke-linecap', 'round');
    });
    _paperEdgesBuilt = true;
  }
  d3.select('#board').selectAll('.paper-edge').style('display', visible ? null : 'none');

function relatedIDs(id) {
  const out = connectedIDs(id);
  const isConcept = nodes.some((item) => item.id === id);
  if (!isConcept) return out;

  const linkedPaperIDs = [];
  edges.forEach((edge) => {
    if (edge.kind !== 'paper') return;
    if (edge.from === id) linkedPaperIDs.push(edge.to);
    if (edge.to === id) linkedPaperIDs.push(edge.from);
  });

  linkedPaperIDs.forEach((paperID) => {
    out.add(paperID);
    edges.forEach((edge) => {
      if (edge.kind !== 'paper') return;
      if (edge.from === paperID) out.add(edge.to);
      if (edge.to === paperID) out.add(edge.from);
    });
  });
  return out;
}

function connectedIDs(id) {
  const out = new Set([id]);
  edges.forEach((edge) => {
    if (edge.from === id) out.add(edge.to);
    if (edge.to === id) out.add(edge.from);
  });
  return out;
}

function itemByID(id) {
  return nodes.find((item) => item.id === id) || papers.find((item) => item.id === id);
}

function edgeRecord(from, to, kind, domIndex) {
  return { from, to, kind, domIndex };
}

function uniqueByID(items) {
  const seen = new Set();
  return items.filter((item) => {
    if (!item || seen.has(item.id)) return false;
    seen.add(item.id);
    return true;
  });
}

function rootNodeIDs(rawNodes) {
  const ids = new Set(rawNodes.map((node) => node.node_id));
  const roots = rawNodes.filter((node) => !node.parent_node_id || !ids.has(node.parent_node_id)).map((node) => node.node_id);
  return roots.length ? roots : rawNodes.map((node) => node.node_id);
}

function rootID(raw, rawNodes) {
  const byID = new Map(rawNodes.map((node) => [node.node_id, node]));
  let current = raw;
  let guard = 0;
  while (current?.parent_node_id && byID.has(current.parent_node_id) && guard < 20) {
    current = byID.get(current.parent_node_id);
    guard += 1;
  }
  return current?.node_id || raw.node_id;
}

function nodeDepth(raw, rawNodes) {
  const byID = new Map(rawNodes.map((node) => [node.node_id, node]));
  let depth = 0;
  let current = raw;
  while (current?.parent_node_id && byID.has(current.parent_node_id) && depth < 10) {
    current = byID.get(current.parent_node_id);
    depth += 1;
  }
  return depth;
}

function nodeLabel(title) {
  const text = String(title || '').replace(/\s+/g, ' ').trim();
  if (!text) return { lines: [''], fontSize: 18, lineHeight: 23 };
  const ascii = /^[\x00-\x7F]+$/.test(text);
  const fontSize = ascii ? 19.5 : 21.5;

  let lines;
  if (ascii) {
    const words = text.split(/[ _・:()/-]+/).filter(Boolean).slice(0, 6);
    if (words.length <= 1) {
      lines = [words.join('')];
    } else {
      const targetLines = Math.max(1, Math.ceil(Math.sqrt(words.length)) - 1);
      const perLine = Math.ceil(words.length / targetLines);
      lines = [];
      for (let i = 0; i < words.length; i += perLine) {
        lines.push(words.slice(i, i + perLine).join(' '));
      }
    }
  } else {
    // 英字の連続は1トークン、日本語は1文字ずつトークン化
    const tokens = [];
    const cleaned = text.replace(/[（）()・]/g, ' ');
    const re = /[A-Za-z0-9][-A-Za-z0-9]*/g;
    let last = 0;
    let m;
    while ((m = re.exec(cleaned)) !== null) {
      const before = Array.from(cleaned.slice(last, m.index).replace(/\s/g, ''));
      tokens.push(...before);
      tokens.push(m[0]);
      last = m.index + m[0].length;
    }
    const after = Array.from(cleaned.slice(last).replace(/\s/g, ''));
    tokens.push(...after);
    const filtered = tokens.filter(Boolean);
    // 英字トークンと日本語トークンの境界で改行グループを作る
    const groups = [];
    let cur = [];
    filtered.forEach((tok) => {
      const isLatin = /^[A-Za-z0-9]/.test(tok);
      const prevIsLatin = cur.length > 0 && /^[A-Za-z0-9]/.test(cur[0]);
      if (cur.length > 0 && isLatin !== prevIsLatin) {
        groups.push(cur);
        cur = [];
      }
      cur.push(tok);
    });
    if (cur.length) groups.push(cur);
    // 各グループ内を適切な幅で改行
    lines = [];
    groups.forEach((g) => {
      const isLatin = /^[A-Za-z0-9]/.test(g[0]);
      if (isLatin) {
        lines.push(g.join(' '));
      } else {
        const lineSize = Math.max(4, Math.ceil(Math.sqrt(g.length)) + 1);
        for (let i = 0; i < g.length; i += lineSize) {
          lines.push(g.slice(i, i + lineSize).join(''));
        }
      }
    });
  }
  return { lines, fontSize, lineHeight: fontSize + 5.0 };
}

function nodeRadius(label) {
  const longest = Math.max(...label.lines.map((line) => visualLength(line)), 1);
  const width = longest * label.fontSize * 0.62;
  const height = label.lines.length * label.lineHeight;
  return Math.sqrt(width * width + height * height) / 2 + 10;
}

function fitNodeLabelToRadius(label, radius) {
  const required = nodeRadius(label);
  if (required <= radius) return label;
  const scale = Math.max(0.56, (radius - 9) / Math.max(required - 9, 1));
  const fontSize = Math.max(16.0, label.fontSize * scale);
  return {
    ...label,
    fontSize,
    lineHeight: fontSize + 4.5
  };
}

// Fixed-size nodes: same radius regardless of paper/concept count.
// Visual hierarchy is conveyed by ring/badge/color, not by radius.
const FIXED_NODE_RADIUS = 28;
function fieldRadius(paperCount, conceptCount) {
  return FIXED_NODE_RADIUS;
}

function visualLength(value) {
  return Array.from(String(value || '')).reduce((sum, ch) => sum + (/^[\x00-\x7F]$/.test(ch) ? 1 : 1.6), 0);
}

function domainTime(domain) {
  const years = [
    ...yearsFromValue(domain?.source_year),
    ...yearsFromValue(domain?.source_years),
    ...yearsFromValue(domain?.syllabus_version_id),
    ...yearsFromValue(domain?.domain_id)
  ];
  if (!years.length) return { known: false, value: -Infinity, label: '時期不明' };
  const value = Math.max(...years);
  return { known: true, value, label: String(value) };
}

function nodeObservedTime(node) {
  const years = yearsFromObject(node);
  if (!years.length) return null;
  const value = Math.max(...years);
  return { known: true, value, label: String(value) };
}

function paperObservedTime(paper) {
  const years = yearsFromObject(paper);
  if (!years.length) return null;
  const value = Math.max(...years);
  return { known: true, value, label: String(value) };
}

function yearsFromObject(value) {
  if (!value || typeof value !== 'object') return [];
  return [
    ...yearsFromValue(value.published_at),
    ...yearsFromValue(value.updated_at),
    ...yearsFromValue(value.source_published_at),
    ...yearsFromValue(value.source_updated_at),
    ...yearsFromValue(value.observed_at),
    ...yearsFromValue(value.collected_at),
    ...yearsFromValue(value.first_seen_at),
    ...yearsFromValue(value.last_seen_at),
    ...yearsFromValue(value.source_year),
    ...yearsFromValue(value.source_years),
    ...yearsFromValue(value.discovery_year),
    ...yearsFromValue(value.year),
    ...yearsFromValue(value.years)
  ];
}

function yearsFromValue(value) {
  if (Array.isArray(value)) return value.flatMap(yearsFromValue);
  const matches = String(value || '').match(/(?:19|20)\d{2}/g);
  if (!matches) return [];
  return matches.map(Number).filter((year) => year >= 1990 && year <= 2100);
}

function domainLabel(domain) {
  return domain?.domain_id || domain?.syllabus_version_id || '知識領域';
}

function bandLabel(band) {
  return band.time.known ? `${band.time.label}  ${band.label}` : `時期不明  ${band.label}`;
}

function nodeTitle(node) {
  if (!node) return '';
  const lang = window.__cbLang || 'ja';
  if (lang === 'en') return node.title_en || node.title_ja || node.node_id || '';
  return node.title_ja || node.title_en || node.node_id || '';
}

function paperTitle(paper) {
  if (!paper) return '';
  const lang = window.__cbLang || 'ja';
  if (lang === 'en') return paper.paper_title_en || paper.paper_title || paper.paper_title_ja || paper.paper_id || '';
  return paper.paper_title_ja || paper.paper_title || paper.paper_title_en || paper.paper_id || '';
}

function trimPaperTitle(value, maxLength = 50) {
  const text = String(value || '').replace(/\s+/g, ' ').trim();
  return text.length > maxLength ? `${text.slice(0, Math.max(1, maxLength - 1))}…` : text;
}

function trimPaperTitleToWidth(value, maxWidth, fontSize) {
  const text = String(value || '').replace(/\s+/g, ' ').trim();
  if (measureTextWidth(text, fontSize) <= maxWidth) return text;
  const chars = Array.from(text);
  let lo = 1;
  let hi = chars.length;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    if (measureTextWidth(chars.slice(0, mid).join('') + '…', fontSize) <= maxWidth) lo = mid;
    else hi = mid - 1;
  }
  return chars.slice(0, lo).join('').trimEnd() + '…';
}

function measureTextWidth(value, fontSize) {
  if (!measureCanvas) measureCanvas = document.createElement('canvas');
  const context = measureCanvas.getContext('2d');
  context.font = `500 ${fontSize}px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif`;
  return context.measureText(String(value || '')).width;
}

function paperLabel(paper) {
  return `${paper.time.label} ${paper.title}`;
}

function renderAchievementRing(group, node) {
  const r = (node.visualRadius || node.radius) + 8.0;
  const fraction = achievementFraction(node.achievement);
  const colors = achievementSegmentColors(node.achievementSources, fraction);
  const segments = 24;
  const start = -Math.PI * 0.72;
  const sweep = Math.PI * 1.44;
  const gap = 0.012;
  const active = Math.ceil(segments * fraction);
  const arc = d3.arc()
    .innerRadius(r - 6.2)
    .outerRadius(r + 3.2);

  for (let i = 0; i < segments; i += 1) {
    const a0 = start + (sweep * i) / segments + gap;
    const a1 = start + (sweep * (i + 1)) / segments - gap;
    const on = i < active;
    group.append('path')
      .attr('d', arc.startAngle(a0).endAngle(a1)())
      .attr('transform', `translate(${node.x},${node.y})`)
      .attr('fill', on ? colors[i % colors.length] : '#64748b')
      .attr('fill-opacity', on ? 1.0 : 0.62)
      .attr('pointer-events', 'none');
  }
}

function aggregateAchievementSources(rawNodes) {
  const keys = ['assets', 'overview', 'formula', 'quiz', 'added_explanation'];
  const out = { paper_total: 0, assets: 0, overview: 0, formula: 0, quiz: 0, added_explanation: 0 };
  rawNodes.forEach((raw) => {
    const src = raw.achievement_sources || {};
    out.paper_total += Number(src.paper_total || 0);
    keys.forEach((key) => {
      out[key] += Number(src[key] || 0);
    });
  });
  return out;
}

function achievementSegmentColors(sources, fraction) {
  const sourceColors = {
    assets: '#0ea5e9',
    overview: '#22c55e',
    formula: '#a855f7',
    quiz: '#f59e0b',
    added_explanation: '#ef4444'
  };
  const weighted = [];
  ['assets', 'overview', 'formula', 'quiz', 'added_explanation'].forEach((key) => {
    const count = Math.max(0, Math.round(Number(sources?.[key] || 0)));
    for (let i = 0; i < count; i += 1) weighted.push(sourceColors[key]);
  });
  return weighted.length ? weighted : [achievementColorByFraction(fraction)];
}

function aggregateAchievement(values) {
  const states = values.map((value) => achievementFraction(value)).filter((value) => Number.isFinite(value));
  if (!states.length) return 'not_started';
  const avg = states.reduce((sum, value) => sum + value, 0) / states.length;
  if (avg >= 0.95) return 'measured';
  if (avg >= 0.74) return 'questioned';
  if (avg >= 0.58) return 'explained';
  if (avg >= 0.42) return 'annotating';
  if (avg >= 0.24) return 'reading';
  if (avg > 0) return 'collecting';
  return 'not_started';
}

function achievementAverage(values) {
  const states = values.map((value) => achievementFraction(value)).filter((value) => Number.isFinite(value));
  if (!states.length) return 0;
  return states.reduce((sum, value) => sum + value, 0) / states.length;
}

function achievementFraction(value) {
  switch (value) {
    case 'collecting': return 0.16;
    case 'reading': return 0.34;
    case 'annotating': return 0.50;
    case 'explained': return 0.66;
    case 'questioned': return 0.82;
    case 'measured': return 1.0;
    default: return 0;
  }
}

function achievementColor(value) {
  switch (value) {
    case 'collecting': return '#38bdf8';
    case 'reading': return '#f59e0b';
    case 'annotating': return '#a855f7';
    case 'explained': return '#2563eb';
    case 'questioned': return '#14b8a6';
    case 'measured': return '#16a34a';
    default: return '#94a3b8';
  }
}

function achievementColorByFraction(value) {
  if (value >= 0.82) return '#16a34a';
  if (value >= 0.66) return '#14b8a6';
  if (value >= 0.50) return '#2563eb';
  if (value >= 0.34) return '#a855f7';
  if (value > 0) return '#38bdf8';
  return '#94a3b8';
}

function scopedID(domIndex, rawID) {
  return `${domIndex}::${rawID}`;
}

function curvePath(from, to) {
  const mx = (from.x + to.x) / 2;
  return `M${from.x},${from.y} C${mx},${from.y} ${mx},${to.y} ${to.x},${to.y}`;
}

function tintColor(hex, factor) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const tr = Math.round(r + (255 - r) * factor);
  const tg = Math.round(g + (255 - g) * factor);
  const tb = Math.round(b + (255 - b) * factor);
  return `rgb(${tr},${tg},${tb})`;
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function showTip(event, title, time, type, assetsState, overviewState, formulaState, quizState, addedExplanationState) {
  const timeLabel = time?.known ? time.label : '時期不明';
  const assetsLine = assetsState ? `<br>図表: ${escapeHTML(assetsPipelineLabel(assetsState))}` : '';
  const overviewLine = overviewState ? `<br>概略解説: ${escapeHTML(overviewLabel(overviewState))}` : '';
  const formulaLine = formulaState ? `<br>数式カード: ${escapeHTML(formulaLabel(formulaState))}` : '';
  const quizLine = quizState ? `<br>演習: ${escapeHTML(quizLabel(quizState))}` : '';
  const addedLine = addedExplanationState ? `<br>解説追加: ${escapeHTML(addedExplanationLabel(addedExplanationState))}` : '';
  tip.style('display', 'block')
    .style('left', `${event.pageX + 12}px`)
    .style('top', `${event.pageY + 12}px`)
    .html(`<b>${escapeHTML(title)}</b><br>種別: ${escapeHTML(type)}<br>時間: ${escapeHTML(timeLabel)}${assetsLine}${overviewLine}${formulaLine}${quizLine}${addedLine}`);
}

function hideTip() {
  tip.style('display', 'none');
}

function assetsPipelineColor(state) {
  switch (state) {
    case 'finished': return '#16a34a';
    case 'running': return '#f59e0b';
    case 'failed': return '#dc2626';
    default: return '#94a3b8';
  }
}

function assetsPipelineLabel(state) {
  switch (state) {
    case 'finished': return '実施済み';
    case 'running': return '実行中';
    case 'failed': return '失敗';
    default: return '未実施';
  }
}

function overviewLabel(state) {
  switch (state) {
    case 'generated': return '生成済み';
    default: return '未生成';
  }
}

function formulaLabel(state) {
  switch (state) {
    case 'explained': return '説明済み';
    case 'created': return '作成済み';
    default: return '未作成';
  }
}

function quizLabel(state) {
  switch (state) {
    case 'generated': return '生成済み';
    default: return '未生成';
  }
}

function addedExplanationLabel(state) {
  switch (state) {
    case 'generated': return '追加済み';
    default: return '未追加';
  }
}

function escapeHTML(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

init();
</script>
